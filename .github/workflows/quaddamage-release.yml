# QuadDamage — binarios multiplataforma (Linux/Windows/macOS) + imagen Docker.
# Compila el CLIENTE (ioquake3) y el SERVIDOR dedicado (ioq3ded), más los módulos
# del juego. Se dispara en tags v* o manualmente (workflow_dispatch).
name: QuadDamage Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------- Linux
  linux:
    name: Linux x86_64 (cliente + servidor)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libsdl2-dev libgl1-mesa-dev libopenal-dev
      - name: Build (cliente + servidor, standalone)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_STANDALONE=ON \
            -DBUILD_CLIENT=ON -DBUILD_SERVER=ON
          cmake --build build -j"$(nproc)"
      - name: "Empaquetar (cliente + servidor + modulos)"
        run: |
          test -d build/Release || { echo "no hay build/Release"; ls -R build | head; exit 1; }
          echo "binarios producidos"; ls -la build/Release
          tar czf quaddamage-${{ github.ref_name }}-linux-x86_64.tar.gz -C build Release
      - uses: actions/upload-artifact@v4
        with: { name: linux-x86_64, path: "*.tar.gz" }

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows x86_64 (cliente + servidor)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Build (libs internas)
        run: |
          cmake -S . -B build -DBUILD_STANDALONE=ON -DUSE_INTERNAL_LIBS=ON `
            -DBUILD_CLIENT=ON -DBUILD_SERVER=ON
          cmake --build build --config Release -j
      - name: Empaquetar
        shell: bash
        run: |
          test -d build/Release || { echo "no hay build/Release"; ls -R build | head; exit 1; }
          ls -la build/Release
          7z a quaddamage-${{ github.ref_name }}-win64.zip ./build/Release/*
      - uses: actions/upload-artifact@v4
        with: { name: win64, path: "*.zip" }

  # ---------------------------------------------------------------- macOS
  macos:
    name: macOS arm64 (cliente + servidor)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake sdl2 openal-soft
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_STANDALONE=ON \
            -DBUILD_CLIENT=ON -DBUILD_SERVER=ON
          cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Empaquetar
        run: |
          test -d build/Release || { echo "no hay build/Release"; ls -R build | head; exit 1; }
          ls -la build/Release
          tar czf quaddamage-${{ github.ref_name }}-macos-arm64.tar.gz -C build Release
      - uses: actions/upload-artifact@v4
        with: { name: macos-arm64, path: "*.tar.gz" }

  # ---------------------------------------------------------------- Docker (servidor)
  docker:
    name: Imagen Docker del servidor (GHCR)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/ab4cus/quaddamage-server:latest
            ghcr.io/ab4cus/quaddamage-server:${{ github.ref_name }}

  # ---------------------------------------------------------------- Release
  release:
    name: Publicar GitHub Release
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Generar SHA256SUMS (los instaladores CLI verifican contra este archivo)
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-files/ \;
          cd release-files && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
